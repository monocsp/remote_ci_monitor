# CI. 집계 잡 `test` 는 main 룰셋의 필수 체크다. 잡 이름을 바꾸면 룰셋도 같이 바꿔야 한다.
# ⚠️ matrix 잡의 체크 이름은 `unit (3.11, ubuntu-latest)` 처럼 바뀌므로 룰셋은 `test` 만 본다.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 개발 의존성 (pytest · ruff)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest
      - name: 웹 UI 순수 함수 (node --test)
        if: hashFiles('tests/web/*.test.js') != ''
        run: node --test tests/web/*.test.js
      - name: 뮤테이션 확인 (테스트가 실제로 빨개지는지)
        if: hashFiles('scripts/mutcheck.py') != ''
        run: python scripts/mutcheck.py

  # README 「5-minute setup」을 새 venv 에서 wheel 로 그대로 돌린다(scripts/smoke_install.sh).
  smoke:
    name: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: wheel 빌드
        run: python -m pip install -q build && python -m build --wheel
      - name: 설치 스모크 (새 venv · README 절차 · 루프백)
        run: scripts/smoke_install.sh dist/*.whl

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 집계 잡. 룰셋 필수 체크는 이 이름(`test`)으로 잡혀 있다.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [unit, secrets, smoke]
    if: always()
    steps:
      - name: unit · secrets · smoke 셋 다 success 여야 통과
        env:
          UNIT: ${{ needs.unit.result }}
          SECRETS: ${{ needs.secrets.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "unit=$UNIT secrets=$SECRETS smoke=$SMOKE"
          if [ "$UNIT" != "success" ] || [ "$SECRETS" != "success" ] || [ "$SMOKE" != "success" ]; then
            echo "::error::unit=$UNIT secrets=$SECRETS smoke=$SMOKE — 셋 다 success 여야 한다."
            exit 1
          fi
