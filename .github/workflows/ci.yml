# CI. 이 잡(test)은 main 룰셋의 필수 체크다. 잡 이름을 바꾸면 룰셋도 같이 바꿔야 한다.
# M0 에서 pytest · ruff · 시크릿 스캔을 이 잡에 채운다. 그 전까지는 자리표시자다.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 (M0 에서 채운다)
        run: |
          echo "::warning::아직 테스트가 없다. M0 에서 pytest · ruff · 시크릿 스캔을 이 잡에 넣어라."
