# 자동 태그. main 에 push 가 오면 __version__ 을 읽어 태그 `v<X>` 가 없으면 그 커밋에 만들고, 같은 run 에서
# release.yml 을 workflow_call 로 불러 wheel · sdist · GitHub Release 를 만든다(docs/gate-replay-fixes-workplan.md
# §3 I8-2 · 결정 82). 왜 같은 run 에서 부르나: GITHUB_TOKEN 이 만든 태그는 다른 워크플로(`on: push: tags`)를
# 깨우지 않는다 — GitHub 의 규칙. 태그가 이미 그 커밋에 있으면 무동작(같은 버전 재푸시는 no-op), 다른 커밋을
# 가리키면 거절(버전을 재사용한 것이다). 브랜치는 절대 건드리지 않는다 — 태그 ref 하나만 push 한다.
name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: __version__ → 태그 이름
        id: version
        run: |
          VER=$(python -c "import sys; sys.path.insert(0, 'src'); import remote_ci_monitor as m; print(m.__version__)")
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "version $VER → tag v$VER"
      - name: 태그가 이미 있으면 — 같은 커밋이면 무동작, 다른 커밋이면 거절
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 주석 달린 태그는 `^{}` 줄(벗겨낸 커밋)이 뒤에 붙는다 — 마지막 줄이 언제나 커밋이다
          AT=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ -n "$AT" ]; then
            if [ "$AT" = "$GITHUB_SHA" ]; then
              echo "tag $TAG already points at $GITHUB_SHA — nothing to do"
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::tag $TAG already exists at $AT, not at $GITHUB_SHA — bump __version__ instead of reusing it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "created tag $TAG at $GITHUB_SHA"

  # 호출된 워크플로의 잡은 이 잡의 권한을 넘지 못한다 — release.yml 의 잡 수준 권한(contents · id-token)을 그대로 준다.
  release:
    name: release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
