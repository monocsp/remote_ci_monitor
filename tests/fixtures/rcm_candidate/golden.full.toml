# ~/.config/rcm/server.toml — the owner's file; comments and order must survive

[server]
port = 8787
data_dir = "/var/empty/rcm-candidate-fixture"

# [[repos]]
# name = "commented"

[[repos]]
name = "other"
url = "git@example.invalid:o/other.git"

[[repos]]
name = "app"   # the one
url = "git@example.invalid:o/app.git"


# generated by rcm-store-connect — profile.release.toml: the whole [repos.app.release] block.
#
# It belongs right after the [[repos]] entry whose name is "app" in the rcm server's server.toml
# (TOML attaches the sub-table to the preceding entry); scripts/rcm/rcm_candidate.py puts it there.
# Optional roles other skills add later (gate, qa, dev, driver) live in this same file.
# Schema: docs/release-contract.md §1 and docs/configuration.md «Release profile».
#
# What is NOT here, on purpose: secret values (they live under <config_dir>/secrets/app/, entered in the
# Store tab Settings screen), an `automatic_release` or `rollout` switch (rcm never releases after approval),
# and a build number (a human types it in every submission).

[repos.app.release]
default_branch       = "main"                      # where releases are cut from
tag                  = "prod/{version}-{build}"    # "release exists" == this tag exists; keep {version} and {build}
build_number_policy  = "auto"                      # "auto": N = store max + 1, computed by scripts/release/release_plan.sh
plan_max_age_minutes = 30                          # older plans get a stale badge and keep the irreversible buttons closed
version_ttl_hours    = 24                          # a new-version draft nobody edits is discarded after this (integer ≥ 1)
# driver             = "scripts/release/product_release.sh"   # optional S0–S8 driver — /rcm-release-driver adds it
secrets_dir_env      = "APP_SECRETS"           # the job sees the secrets folder as $APP_SECRETS

[repos.app.release.presets]
plan   = "release-plan"                            # read-only store snapshot -> plan.json
upload = "release-upload"                          # store upload -> upload.json (rehearsal by default)
review = "release-review"                          # review plan / submit -> review-plan.json / review.json
version = "release-version"                        # optional — «new version» from the web: prefill / create / delete
# gate = "gate-<basename>"                         # optional — /rcm-gate-connect names it after the CI script
# qa   = "qa-<harness>"                            # optional — /rcm-qa-connect names it after the QA harness

# Secrets the Settings screen asks for — one entry per file the scripts read from the secrets folder.
# kind = "value" (typed, becomes a file of that name) | "file" (uploaded, keeps its name) | "dir" (a set of files).
# verify = "asc" | "play" | "github" | "keystore" | "none" — read-only checks rcm can run on the value.
# The list below is the skill's answer to the platform question; edit names to match what the scripts read.
# ── iOS (App Store Connect API key) — delete this group if the project does not ship to iOS ──
[[repos.app.release.secrets]]
name   = "ASC_KEY_ID"
kind   = "value"
verify = "asc"
[[repos.app.release.secrets]]
name   = "ASC_ISSUER_ID"
kind   = "value"
verify = "asc"
[[repos.app.release.secrets]]
name   = "AuthKey.p8"
kind   = "file"
verify = "asc"
max_kb = 16

# ── Android (Play service account + upload keystore) — delete this group if the project does not ship to Android ──
[[repos.app.release.secrets]]
name   = "play-service-account.json"
kind   = "file"
verify = "play"
max_kb = 64
[[repos.app.release.secrets]]
name   = "upload-keystore.jks"
kind   = "file"
verify = "keystore"
max_kb = 512
[[repos.app.release.secrets]]
name = "KEYSTORE_PASSWORD"
kind = "value"
[[repos.app.release.secrets]]
name = "KEY_ALIAS"
kind = "value"
[[repos.app.release.secrets]]
name = "KEY_PASSWORD"
kind = "value"

# ── Optional extras the project may need (uncomment what the scripts actually read) ──
# [[repos.app.release.secrets]]
# name     = "GH_TOKEN"           # only if the scripts call GitHub (driver, PR creation)
# kind     = "value"
# verify   = "github"
# [[repos.app.release.secrets]]
# name     = "review_information" # App Review demo account + contact, one file each
# kind     = "dir"
# files    = ["demo_user.txt", "demo_password.txt", "notes.txt"]

[[repos]]
name = "third"
url = "git@example.invalid:o/third.git"

[[presets]]
name = "gate"   # kept
argv = ["bash", "scripts/gate.sh"]
[presets.env]
CI = "1"

[[presets]]
name = "release-plan"
description = "Store snapshot on a pushed ref -> plan.json (read-only; computes N)"
argv = ["bash", "scripts/release/release_plan.sh"]
source_modes = ["git_ref"]
repo = "app"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 600
expected_seconds = 120
concurrency_group = "store-app"
artifacts = ["build/.rcm-release/plan.json", "build/.rcm-release/snapshot.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"

[[presets]]
name = "release-upload"
description = "Upload the build to the stores -> upload.json (mode=rehearsal by default: no store call)"
argv = ["bash", "scripts/release/release_upload.sh"]
source_modes = ["git_ref"]
repo = "app"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 3600
expected_seconds = 1200
concurrency_group = "store-app"
artifacts = ["build/.rcm-release/upload.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"
[[presets.inputs]]
name = "build_name_android"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"       # the empty default must match too — hence the optional group
default = ""                              # rcm sends it only when the two stores get different names
description = "Android version name when it differs from build_name (X.Y.Z); empty = both stores get build_name"
[[presets.inputs]]
name = "confirm_build_number"
type = "int"
description = "The build number N you typed after reading plan.json — the script compares it with the store"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["rehearsal", "upload"]
default = "rehearsal"                     # irreversible value is never the default
description = "rehearsal: everything except the store call · upload: the real thing"
[[presets.inputs]]
name = "platform"
type = "choice"
choices = ["both", "ios", "android"]
default = "both"
[[presets.inputs]]
name = "android_track"
type = "choice"
choices = ["production", "internal"]
default = "production"
[[presets.inputs]]
name = "listing_json"
type = "string"
default = ""                              # rcm fills it with the web-edited listing (JSON); empty = store/ files
description = "Listing copy edited in the web UI as JSON — overrides the store/ files when not empty"

[[presets]]
name = "release-review"
description = "Review plan (read-only) or submit for review -> review-plan.json / review.json"
argv = ["bash", "scripts/release/release_review.sh"]
source_modes = ["git_ref"]
repo = "app"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 900
expected_seconds = 180
concurrency_group = "store-app"
artifacts = ["build/.rcm-release/review-plan.json", "build/.rcm-release/review.json", "build/.rcm-release/review-observe.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"
[[presets.inputs]]
name = "build_name_android"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"       # the empty default must match too — hence the optional group
default = ""                              # rcm sends it only when the two stores get different names
description = "Android version name when it differs from build_name (X.Y.Z); empty = both stores get build_name"
[[presets.inputs]]
name = "confirm_build_number"
type = "string"
pattern = "^([0-9]+)?$"
default = ""                              # empty for mode=plan; typed by a human for mode=submit
description = "The build number N under review, typed again — empty for a review plan"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["plan", "submit"]
default = "plan"                          # irreversible value is never the default
[[presets.inputs]]
name = "platform"
type = "choice"
choices = ["both", "ios", "android"]
default = "both"
[[presets.inputs]]
name = "play_managed_publishing"
type = "choice"
choices = ["not-checked", "confirmed-on"]
default = "not-checked"                   # rcm sends confirmed-on only when the human ticked it in this submission
description = "Human statement that managed publishing is ON in the Play Console (the API cannot verify it)"
[[presets.inputs]]
name = "listing"
type = "choice"
choices = ["notes-only", "full"]
default = "notes-only"
description = "notes-only: release notes · full: the whole store listing"
[[presets.inputs]]
name = "phased"
type = "choice"
choices = ["1", "0"]
default = "1"
description = "1: phased release on (default) · 0: off"
[[presets.inputs]]
name = "listing_json"
type = "string"
default = ""                              # rcm fills it with the web-edited listing (JSON); empty = store/ files
description = "Listing copy edited in the web UI as JSON — overrides the store/ files when not empty"

[[presets]]
name = "release-version"
description = "New version: prefill the listing from the live version (default, read-only), create or delete an App Store version"
argv = ["bash", "scripts/release/release_version.sh"]
source_modes = ["git_ref"]
repo = "app"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 600
expected_seconds = 60
concurrency_group = "store-app"
artifacts = ["build/.rcm-release/version.json", "build/.rcm-release/prefill.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["prefill", "create", "delete"]
default = "prefill"                       # create makes a store draft, delete is irreversible — never defaults
description = "prefill: read the live listing · create: new App Store version + prefill · delete: drop a draft"
[[presets.inputs]]
name = "ios_version"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"
default = ""                              # empty = do not create an App Store version
description = "App Store version to create (X.Y.Z); empty = iOS untouched"
[[presets.inputs]]
name = "android_version"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"
default = ""                              # empty = no Android draft (Play has no version object; rcm keeps the name)
description = "Android version name to draft (X.Y.Z); empty = Android untouched"
[[presets.inputs]]
name = "asc_version_id"
type = "string"
default = ""                              # mode=delete: the App Store Connect version id
description = "App Store Connect version id (mode=delete)"
