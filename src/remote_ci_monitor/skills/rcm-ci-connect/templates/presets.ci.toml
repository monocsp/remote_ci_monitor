# ~/.config/rcm/presets.{{preset}}.toml — add it to server.toml's `include` (rcm-ci-connect)
[[presets]]
name = "{{preset}}"
description = "{{repo}} checks on the build machine"
source_modes = ["git_ref"]
repo = "{{repo_name}}"                  # the [[repos]] name in server.toml
# pool = "mac2"                          # keep it off the lanes other projects use
priority = "low"
concurrency_group = "{{preset}}"
supersede = "all"                       # a newer commit on the branch cancels the older job
expected_seconds = 1260
timeout_seconds = 3300                  # shorter than run_seconds, so rcm says timed_out first
requires = ["/usr/bin/nice", "git"]
argv = ["/usr/bin/nice", "-n", "10", "/bin/bash", "scripts/ci/rcm_ci.sh"]

