# generated by rcm-store-connect — presets.release.toml: every rcm preset of this project, one file.
#
# The store roles (release-plan / release-upload / release-review, and release-version for «new version»
# from the web) are here; /rcm-gate-connect and /rcm-qa-connect append theirs. scripts/rcm/rcm_candidate.py merges this file into a candidate
# server.toml for `rcm check`; the server owner copies the result into place.
#
# Inputs are exactly the ones rcm sends per role (docs/release-contract.md §2). Do not add an input that
# releases, publishes or rolls out anything: rcm must never be able to release after store approval.
# The irreversible values (mode = upload / submit / create / delete) are choices, never defaults — `rcm check`
# fails otherwise. `listing_json` on upload / review carries the copy edited in the web UI (version page);
# without it `rcm check` warns and the edited copy never reaches the scripts. `build_name_android` carries the
# Android version name when the two stores ship different names; without it they must share one name.

[[presets]]
name = "release-plan"
description = "Store snapshot on a pushed ref -> plan.json (read-only; computes N)"
argv = ["bash", "{{scripts_dir}}/release_plan.sh"]
source_modes = ["git_ref"]
repo = "{{repo}}"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 600
expected_seconds = 120
concurrency_group = "store-{{repo}}"
artifacts = ["build/.rcm-release/plan.json", "build/.rcm-release/snapshot.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"

[[presets]]
name = "release-upload"
description = "Upload the build to the stores -> upload.json (mode=rehearsal by default: no store call)"
argv = ["bash", "{{scripts_dir}}/release_upload.sh"]
source_modes = ["git_ref"]
repo = "{{repo}}"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 3600
expected_seconds = 1200
concurrency_group = "store-{{repo}}"
artifacts = ["build/.rcm-release/upload.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"
[[presets.inputs]]
name = "build_name_android"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"       # the empty default must match too — hence the optional group
default = ""                              # rcm sends it only when the two stores get different names
description = "Android version name when it differs from build_name (X.Y.Z); empty = both stores get build_name"
[[presets.inputs]]
name = "confirm_build_number"
type = "int"
description = "The build number N you typed after reading plan.json — the script compares it with the store"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["rehearsal", "upload"]
default = "rehearsal"                     # irreversible value is never the default
description = "rehearsal: everything except the store call · upload: the real thing"
[[presets.inputs]]
name = "platform"
type = "choice"
choices = ["both", "ios", "android"]
default = "{{platform_default}}"
[[presets.inputs]]
name = "android_track"
type = "choice"
choices = ["production", "internal"]
default = "production"
[[presets.inputs]]
name = "listing_json"
type = "string"
default = ""                              # rcm fills it with the web-edited listing (JSON); empty = store/ files
description = "Listing copy edited in the web UI as JSON — overrides the store/ files when not empty"

[[presets]]
name = "release-review"
description = "Review plan (read-only) or submit for review -> review-plan.json / review.json"
argv = ["bash", "{{scripts_dir}}/release_review.sh"]
source_modes = ["git_ref"]
repo = "{{repo}}"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 900
expected_seconds = 180
concurrency_group = "store-{{repo}}"
artifacts = ["build/.rcm-release/review-plan.json", "build/.rcm-release/review.json", "build/.rcm-release/review-observe.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "build_name"
type = "string"
pattern = "^\\d+\\.\\d+\\.\\d+$"
description = "Version name X.Y.Z"
[[presets.inputs]]
name = "build_name_android"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"       # the empty default must match too — hence the optional group
default = ""                              # rcm sends it only when the two stores get different names
description = "Android version name when it differs from build_name (X.Y.Z); empty = both stores get build_name"
[[presets.inputs]]
name = "confirm_build_number"
type = "string"
pattern = "^([0-9]+)?$"
default = ""                              # empty for mode=plan; typed by a human for mode=submit
description = "The build number N under review, typed again — empty for a review plan"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["plan", "submit"]
default = "plan"                          # irreversible value is never the default
[[presets.inputs]]
name = "platform"
type = "choice"
choices = ["both", "ios", "android"]
default = "{{platform_default}}"
[[presets.inputs]]
name = "play_managed_publishing"
type = "choice"
choices = ["not-checked", "confirmed-on"]
default = "not-checked"                   # rcm sends confirmed-on only when the human ticked it in this submission
description = "Human statement that managed publishing is ON in the Play Console (the API cannot verify it)"
[[presets.inputs]]
name = "listing"
type = "choice"
choices = ["notes-only", "full"]
default = "notes-only"
description = "notes-only: release notes · full: the whole store listing"
[[presets.inputs]]
name = "phased"
type = "choice"
choices = ["1", "0"]
default = "1"
description = "1: phased release on (default) · 0: off"
[[presets.inputs]]
name = "listing_json"
type = "string"
default = ""                              # rcm fills it with the web-edited listing (JSON); empty = store/ files
description = "Listing copy edited in the web UI as JSON — overrides the store/ files when not empty"

[[presets]]
name = "release-version"
description = "New version: prefill the listing from the live version (default, read-only), create or delete an App Store version"
argv = ["bash", "{{scripts_dir}}/release_version.sh"]
source_modes = ["git_ref"]
repo = "{{repo}}"
env_passthrough = ["PATH", "HOME", "LANG", "TMPDIR", "USER"]
timeout_seconds = 600
expected_seconds = 60
concurrency_group = "store-{{repo}}"
artifacts = ["build/.rcm-release/version.json", "build/.rcm-release/prefill.json"]
artifacts_on = "always"
[[presets.inputs]]
name = "mode"
type = "choice"
choices = ["prefill", "create", "delete"]
default = "prefill"                       # create makes a store draft, delete is irreversible — never defaults
description = "prefill: read the live listing · create: new App Store version + prefill · delete: drop a draft"
[[presets.inputs]]
name = "ios_version"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"
default = ""                              # empty = do not create an App Store version
description = "App Store version to create (X.Y.Z); empty = iOS untouched"
[[presets.inputs]]
name = "android_version"
type = "string"
pattern = "^(\\d+\\.\\d+\\.\\d+)?$"
default = ""                              # empty = no Android draft (Play has no version object; rcm keeps the name)
description = "Android version name to draft (X.Y.Z); empty = Android untouched"
[[presets.inputs]]
name = "asc_version_id"
type = "string"
default = ""                              # mode=delete: the App Store Connect version id
description = "App Store Connect version id (mode=delete)"
