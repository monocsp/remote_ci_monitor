# generated by rcm-store-connect — profile.release.toml: the whole [repos.{{repo}}.release] block.
#
# It belongs right after the [[repos]] entry whose name is "{{repo}}" in the rcm server's server.toml
# (TOML attaches the sub-table to the preceding entry); scripts/rcm/rcm_candidate.py puts it there.
# Optional roles other skills add later (gate, qa, dev, driver) live in this same file.
# Schema: docs/release-contract.md §1 and docs/configuration.md «Release profile».
#
# What is NOT here, on purpose: secret values (they live under <config_dir>/secrets/{{repo}}/, entered in the
# Store tab Settings screen), an `automatic_release` or `rollout` switch (rcm never releases after approval),
# and a build number (a human types it in every submission).

[repos.{{repo}}.release]
default_branch       = "main"                      # where releases are cut from
tag                  = "prod/{version}-{build}"    # "release exists" == this tag exists; keep {version} and {build}
build_number_policy  = "auto"                      # "auto": N = store max + 1, computed by scripts/release/release_plan.sh
plan_max_age_minutes = 30                          # older plans get a stale badge and keep the irreversible buttons closed
# driver             = "scripts/release/product_release.sh"   # optional S0–S8 driver — /rcm-release-driver adds it
secrets_dir_env      = "{{secrets_env}}"           # the job sees the secrets folder as ${{secrets_env}}

[repos.{{repo}}.release.presets]
plan   = "release-plan"                            # read-only store snapshot -> plan.json
upload = "release-upload"                          # store upload -> upload.json (rehearsal by default)
review = "release-review"                          # review plan / submit -> review-plan.json / review.json
# gate = "gate-<basename>"                         # optional — /rcm-gate-connect names it after the CI script
# qa   = "qa-<harness>"                            # optional — /rcm-qa-connect names it after the QA harness

# Secrets the Settings screen asks for — one entry per file the scripts read from the secrets folder.
# kind = "value" (typed, becomes a file of that name) | "file" (uploaded, keeps its name) | "dir" (a set of files).
# verify = "asc" | "play" | "github" | "keystore" | "none" — read-only checks rcm can run on the value.
# The list below is the skill's answer to the platform question; edit names to match what the scripts read.
# ── iOS (App Store Connect API key) — delete this group if the project does not ship to iOS ──
[[repos.{{repo}}.release.secrets]]
name   = "ASC_KEY_ID"
kind   = "value"
verify = "asc"
[[repos.{{repo}}.release.secrets]]
name   = "ASC_ISSUER_ID"
kind   = "value"
verify = "asc"
[[repos.{{repo}}.release.secrets]]
name   = "AuthKey.p8"
kind   = "file"
verify = "asc"
max_kb = 16

# ── Android (Play service account + upload keystore) — delete this group if the project does not ship to Android ──
[[repos.{{repo}}.release.secrets]]
name   = "play-service-account.json"
kind   = "file"
verify = "play"
max_kb = 64
[[repos.{{repo}}.release.secrets]]
name   = "upload-keystore.jks"
kind   = "file"
verify = "keystore"
max_kb = 512
[[repos.{{repo}}.release.secrets]]
name = "KEYSTORE_PASSWORD"
kind = "value"
[[repos.{{repo}}.release.secrets]]
name = "KEY_ALIAS"
kind = "value"
[[repos.{{repo}}.release.secrets]]
name = "KEY_PASSWORD"
kind = "value"

# ── Optional extras the project may need (uncomment what the scripts actually read) ──
# [[repos.{{repo}}.release.secrets]]
# name     = "GH_TOKEN"           # only if the scripts call GitHub (driver, PR creation)
# kind     = "value"
# verify   = "github"
# [[repos.{{repo}}.release.secrets]]
# name     = "review_information" # App Review demo account + contact, one file each
# kind     = "dir"
# files    = ["demo_user.txt", "demo_password.txt", "notes.txt"]
