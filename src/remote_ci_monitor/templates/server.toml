# remote_ci_monitor — example server config.
# Copy to ~/.config/rcm/server.toml (or ./rcm.toml) on the build machine and edit.
# Every command the server can run is a preset below; sessions send a preset name + inputs only.

# Presets can also live in their own files (presets only, owned by you, chmod go-w). Paths are
# relative to this file's folder. Whoever can change such a file decides what the server runs.
# include = ["presets.myproject.toml"]

[server]
bind = "127.0.0.1"          # Set your Tailscale IP or 0.0.0.0 to accept remote sessions.
port = 8787
data_dir = "~/.local/share/rcm"
lanes = 1                   # Parallel job lanes. 1 for a single build machine.
admission = "load"          # Lanes 2+ wait while the host is busy. "always" turns the gate off.
cpu_max_percent = 80        # Lanes 2+ do not start a job while CPU is above this. Lane 1 always does.
admission_samples = 3       # This many host samples in a row must be under the cap.
admission_cooldown_seconds = 30   # After a gated lane starts a job, that machine waits this long.
read_auth = "none"          # "none" (LAN/Tailscale) | "basic" (only behind a TLS proxy)
max_snapshot_bytes = 536870912
grace_seconds = 10          # SIGTERM → SIGKILL grace on cancel/timeout
recent_count = 8
failure_window_jobs = 20    # How many finished jobs of a key the failure history looks back over.
failure_min_jobs = 3        # Fewer finished jobs than this in the window: no verdict at all.
upload_stall_seconds = 60
upload_abandon_seconds = 300
retention_days_success = 14     # logs of succeeded jobs are removed after this
retention_days_failure = 30     # failed/cancelled/lost jobs keep their logs this long
# A failed job leaves a 50 KB log and a 720 MB workspace. The log is the evidence and keeps the
# days above; the bulk below goes much sooner. These three delete data - they are written out
# here on purpose so you can see and change them.
workspace_retention_days = 1    # kept workspaces (and the snapshot they came from) go after this
workspace_storage_max_bytes = 107374182400   # 100 GiB ceiling for that bulk, regardless of days. 0 = no limit
min_free_bytes = 10737418240    # reclaim bulk when the filesystem drops under 10 GiB free. 0 = off
metadata_retention_days = 180   # job rows/events are deleted after this (>= sample_days)
retention_sweep_interval_seconds = 3600
git_resolve_timeout_seconds = 20    # git ls-remote at submit time (git_ref presets)
git_fetch_timeout_seconds = 600     # fetch + checkout while materializing
snapshot_cache = true               # content-addressed uploads: only changed files travel
snapshot_cache_days = 30            # blobs unused this long are purged (never while a job references them)
snapshot_cache_max_bytes = 4294967296
snapshot_cache_scope = "global"     # "global" shares identical content between clients | "token"
worker_timeout_seconds = 60         # remote worker with no heartbeat this long: down, its jobs lost
worker_heartbeat_seconds = 5        # heartbeat period handed to `rcm worker`
worker_claim_wait_seconds = 20      # how long /worker/claim may long-poll for a job
artifact_retention_hours = 24       # a fetchable bundle lives this long, from when it is ready
max_artifact_bytes = 1073741824     # per job: the size of the collected files (1 GiB)
max_artifact_files = 10000          # per job: how many files
artifact_storage_max_bytes = 10737418240   # whole server (10 GiB). Full = new bundles dropped, none evicted
artifact_timeout_seconds = 60       # how long collecting the files may take
artifact_cancel_timeout_seconds = 5 # shorter budget after a cancel/timeout (< 2 x worker_heartbeat_seconds)
artifact_transfer_timeout_seconds = 300     # one upload or download
max_concurrent_artifact_transfers = 2       # over this, the server answers 503 instead of waiting
# The shelf keeps marked jobs' files and serves them to any browser on the network (no token).
# Do not put secrets in artifacts. Read at start: change these and restart.
# shelf_dir = "~/.local/share/rcm/shelf"   # default <data_dir>/shelf; another disk is fine
# shelf_max_bytes = 53687091200     # the whole shelf (50 GiB). Full = new keeps fail, none evicted. 0 = off
# shelf_stale_days = 182            # unused this long: cleanup pending (files stay, Restore brings it back)
# shelf_delete_days = 365           # unused this long: deleted
# advertise = true                  # mDNS/DNS-SD: sessions on the same network find this server without an address
#                                   # (default: on when bind is not loopback). advertise_name = "macmini" to rename
# public_url = "http://macmini.tail1234.ts.net:8787"   # start of job links in notifications and rcm run.
#                                   # Empty: a specific bind, else <host>.local (advertise on), else <hostname>
# cancel_requires_submission_token = false   # true: only the submission's cancel token (rcm run keeps it in
#                                   # ~/.local/state/rcm/submissions.json) or an admin token cancels a job.
#                                   # Clients before 0.2.7 then cannot cancel — see docs/configuration.md
# probe_interval_seconds = 600      # each worker re-runs the [[probes]] this often (at least 60)
# auto_checks = true                # a changed fingerprint runs that machine's check presets once
# local_accept_any = true           # this server's own lanes take placement = "any-capable" jobs
# check_sweep_seconds = 30          # how often the automatic checks are looked for

[estimate]
sample_days = 45
min_samples = 2
min_job_seconds = 30
sample_policy = "success"   # "success" | "completed"
default_seconds = 600
floor_remaining_seconds = 30
stuck_multiplier = 3
no_output_seconds = 240      # a job that says nothing about steps is "not responding" after this;
                             # a job that is printing steps only reads as "quiet"
step_stuck_multiplier = 3    # the current step is "not responding" past this many times its own
                             # measured median (never sooner than no_output_seconds)
step_min_samples = 3         # successful runs needed before a step median is trusted

[host]
interval_seconds = 5
gpu = "auto"
top_processes = 5
history_samples = 60

[display]
timezone = ""               # IANA zone, e.g. "Asia/Seoul". Empty = server local / browser local.

# ── Repositories for git_ref presets (deploy/release) ──────────────────────
# The server fetches the ref itself (mirror under <data_dir>/mirrors/<name>) using the build
# machine's git credentials (ssh key / credential helper). Any git hosting works.
# Uncomment and point at your repository:
# [[repos]]
# name = "app"
# url = "git@github.com:org/app.git"
# token_file = "~/.config/rcm/tokens/app.token"  # https:// only: this repo's own token, not the
#                                                # machine's active gh account (configuration.md)

# ── Release profile (Store tab) ────────────────────────────────────────────
# Optional, one per repository, right after its [[repos]] entry: which presets play which release
# role and which secrets the Settings screen asks for. Every role names a [[presets]] entry;
# `rcm check --config` prints one `release <repo>` row (docs/configuration.md, "Release profile").
# `rcm skills install --into <project>` copies the rcm-*-connect skills that write all of this.
# [repos.app.release]
# default_branch = "main"                        # where releases are cut from
# tag = "prod/{version}-{build}"                 # must contain {version} and {build}
# build_number_policy = "auto"                   # "auto" | "manual"
# plan_max_age_minutes = 30                      # older plans get a stale badge
# version_ttl_hours = 24                         # an unedited new-version draft is discarded after this; integer > 0
# driver = "scripts/release/product_release.sh"  # optional; relative path inside the repository
# secrets_dir_env = "APP_SECRETS"                # required when secrets are listed; ^[A-Z][A-Z0-9_]*$
# [repos.app.release.presets]                    # values are [[presets]] names
# plan = "release-plan"                          # required — store snapshot → plan.json
# upload = "release-upload"                      # required — mode must default to "rehearsal"
# review = "release-review"                      # required — mode must default to "plan"
# gate = "gate-smoke"                            # optional
# qa = "scenario-qa"                             # optional
# dev = "deploy-dev"                             # optional
# version = "release-version"                    # optional — «new version» from the web; mode must default to "prefill"
# status = "release-status"                      # optional — both stores' review state → status.json (read-only)
# golive = "release-golive"                      # optional — a release a person asked for; mode must default to "plan"
# [[repos.app.release.secrets]]                  # zero or more; only names and shapes, never values
# name = "AuthKey.p8"                            # file name or env name; unique in the profile
# kind = "file"                                  # "value" | "file" | "dir"
# optional = false
# verify = "asc"                                 # "asc" | "play" | "github" | "keystore" | "none"
# max_kb = 64                                    # kind = "file" only; default 512
# [[repos.app.release.secrets]]
# name = "review_information"
# kind = "dir"
# files = ["demo_user.txt", "demo_password.txt"] # kind = "dir" only: required file names inside
# [repos.app.release.listing]                    # optional: store copy preview on a checkout
# preview = ["python3", "scripts/release/store_listing.py", "preview"]
# diff = ["python3", "scripts/release/store_listing.py", "diff", "--live"]
# validate = ["python3", "scripts/release/store_listing.py", "validate", "--build-name", "{version}", "--version-code", "{build}"]
# screenshots = ["store/screenshots/**/*.png"]
# release_notes = "store/release_notes/{version}/*.txt"

# ── Presets ────────────────────────────────────────────────────────────────
# argv runs from the uploaded workspace root. No shell interpolation: inputs arrive as
# RCM_INPUT_<NAME> environment variables. Scripts may print step markers, e.g.
#   ::rcm::steps::3
#   ::rcm::step::analyze
#   ::rcm::step-end::ok
#   ::rcm::summary::all green
#   ::rcm::fail::flaky_test        # names what broke: a step, a test, a file
# Preset keys: name (required) · argv (required) · description · timeout_seconds · expected_seconds
#   (used until enough real samples exist) · duration_key_inputs (inputs whose value gets its own
#   median) · source_modes (default ["tree"]) · repo · concurrency_group · priority ("low" | "normal" | "high") ·
#   pool (worker pool, default "default") · pools (extra pools a session may pick with --pool) ·
#   env_passthrough (default: PATH HOME LANG) · [presets.env] · requires (tools the job must find in
#   its own environment before it starts — names or absolute paths; missing → failed, tool_missing)
#   · placement ("pool" | "any-capable") · concurrency_scope ("pool" | "host" | "global") · checks
#   (check presets that must pass on a machine first) · check_ref · sample (false: not in medians)
#   · supersede ("off" | "waiting" | "all" — clear older jobs of the same branch when a new one
#   queues; default "off"). See docs/configuration.md, "Superseding older jobs of the same branch".
#   Machines and placement: docs/configuration.md, "Which machine runs a job".
# Input keys: name · type = "choice" | "string" | "int" | "bool" · choices (choice) · pattern (string)
#   · default · description.

# `ok` exists so a fresh install can prove the whole path (`rcm run ok`) before you write real
# presets. It runs no project code — delete it once your own presets work.
[[presets]]
name = "ok"
description = "Sanity check: prints one step marker and exits 0"
argv = ["sh", "-c", "echo ::rcm::step::hello; echo ok"]
timeout_seconds = 60
expected_seconds = 1

[[presets]]
name = "gate"
description = "Full local gate: analyze, test, lint"
argv = ["bash", "scripts/gate.sh"]
timeout_seconds = 1200
source_modes = ["tree"]
priority = "normal"         # "low" | "normal" | "high" — default for this preset and the ceiling for non-admin sessions
pool = "default"            # worker pool for this preset's jobs
# pools = ["linux"]         # extra pools a session may pick with --pool (remote workers, M5b)
expected_seconds = 480
duration_key_inputs = ["scope"]
# artifacts = ["test/**/goldens/*.png"]   # files this job produces that a session may fetch back
# artifacts_on = "failure"                # "always" (default) | "failure" — when to collect
# keep = true                            # also put every job on the shelf (needs artifacts; server 0.7.0+)
# supersede = "all"                       # "off" (default) | "waiting" | "all" — a new job of the same
#                                         # branch, inputs and requester clears the older one
# requires = ["fvm", "gitleaks"]          # looked up in the job's PATH right before it starts;
#                                         # missing → the job fails with tool_missing, nothing runs
env_passthrough = ["PATH", "HOME", "LANG"]
[presets.env]
CI = "1"
# PATH = "/opt/homebrew/bin:/usr/bin:/bin"   # a launchd service has a short PATH — give the job its own
[[presets.inputs]]
name = "scope"
type = "choice"
choices = ["full", "commit", "fast"]
default = "full"

[[presets]]
name = "gate-fast"
description = "Quick checks only"
argv = ["bash", "scripts/gate.sh", "--fast"]
timeout_seconds = 300
expected_seconds = 60

[[presets]]
name = "qa-smoke"
description = "Smoke test on the shared device/simulator (serialized via concurrency_group)"
argv = ["bash", "scripts/qa-smoke.sh"]
timeout_seconds = 900
concurrency_group = "devices"
expected_seconds = 540
[[presets.inputs]]
name = "device"
type = "string"
pattern = "[A-Za-z0-9._-]+"
default = "default"

# ── Notifications ──────────────────────────────────────────────────────────
# Run a command (no shell) or POST JSON to a URL when jobs finish. Env for argv: RCM_JOB_ID RCM_STATE
# RCM_PRESET RCM_KEY RCM_REQUESTER RCM_SUMMARY RCM_FAILED_STEP RCM_EXIT_CODE RCM_JOB_SECONDS RCM_URL
# RCM_NOTIFY. Exactly one of argv / url. `on` defaults to every terminal state.
# [[notify]]
# name = "on-failure"
# on = ["failed", "timed_out", "lost"]
# presets = ["gate"]
# argv = ["bash", "/opt/rcm/notify.sh"]
# timeout_seconds = 30

# A deploy preset runs a remote ref instead of an uploaded tree: `rcm run deploy --ref v1.2.3`.
# The server pins the commit sha at submit time; the workspace is a detached checkout (.git kept,
# submodules are NOT initialised — do it in the script if needed). Requires a [[repos]] entry.
# [[presets]]
# name = "deploy"
# description = "Deploy a tagged release"
# argv = ["bash", "scripts/deploy.sh"]
# source_modes = ["git_ref"]
# repo = "app"
# timeout_seconds = 1800
# concurrency_group = "deploy"

# ── Flutter on several machines (any machine that can run it) ──────────────
# Every worker runs these probes in its own service environment and reports the output as its
# fingerprint; `rcm machines` shows it. The values are visible on /api/machines and /api/status,
# so pick commands that print only a version. Nothing here is built into rcm — adjust freely.
# The output must not move on its own: plain `flutter --version` prints "(4 months ago)", which
# changes the fingerprint every month and re-runs the checks; `--machine` prints JSON instead.
# [[probes]]
# name = "flutter"
# argv = ["fvm", "flutter", "--version", "--machine"]
# timeout_seconds = 30
# [[probes]]
# name = "xcode"
# argv = ["xcodebuild", "-version"]
# [[probes]]
# name = "java"
# argv = ["java", "-version"]
# [[probes]]
# name = "idb"
# argv = ["idb_companion", "--version"]
#
# A check preset: the project's own proof that a machine works (boot a simulator, tap once). It
# must accept git_ref — rcm submits it by itself, pinned to a machine, whenever that machine's
# fingerprint changes. Putting pub get / pod install in front of it also warms the caches.
# [[presets]]
# name = "sim-check"
# description = "Simulator boots and takes a tap"
# argv = ["bash", "scripts/qa/sim_check.sh"]
# source_modes = ["git_ref"]
# repo = "app"
# check_ref = "HEAD"                # the ref rcm runs it from (HEAD = the default branch)
# requires = ["fvm", "xcrun", "idb_companion"]
# timeout_seconds = 900
#
# The gate on any machine that has the tools — no secrets, so it may leave this machine.
# [[presets]]
# name = "flutter-gate"
# argv = ["bash", "scripts/local_ci.sh"]
# placement = "any-capable"         # instead of a pool: any machine whose verdict is eligible
# requires = ["fvm", "gitleaks"]
# concurrency_group = "flutter-gate"
# concurrency_scope = "host"        # one at a time per computer, in parallel across computers
# timeout_seconds = 3600
#
# Simulator QA only where sim-check passed with the machine's current fingerprint.
# [[presets]]
# name = "scenario-qa"
# argv = ["bash", "scripts/qa/scenario.sh"]
# checks = ["sim-check"]
# concurrency_group = "simulator"
# concurrency_scope = "host"
# timeout_seconds = 3600
