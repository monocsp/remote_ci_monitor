# remote_ci_monitor — example server config.
# Copy to ~/.config/rcm/server.toml (or ./rcm.toml) on the build machine and edit.
# Every command the server can run is a preset below; sessions send a preset name + inputs only.

[server]
bind = "127.0.0.1"          # Set your Tailscale IP or 0.0.0.0 to accept remote sessions.
port = 8787
data_dir = "~/.local/share/rcm"
lanes = 1                   # Parallel job lanes. 1 for a single build machine.
admission = "load"          # Lanes 2+ wait while the host is busy. "always" turns the gate off.
cpu_max_percent = 80        # Lanes 2+ do not start a job while CPU is above this. Lane 1 always does.
admission_samples = 3       # This many host samples in a row must be under the cap.
admission_cooldown_seconds = 30   # After a gated lane starts a job, that machine waits this long.
read_auth = "none"          # "none" (LAN/Tailscale) | "basic" (only behind a TLS proxy)
max_snapshot_bytes = 536870912
grace_seconds = 10          # SIGTERM → SIGKILL grace on cancel/timeout
recent_count = 8
failure_window_jobs = 20    # How many finished jobs of a key the failure history looks back over.
failure_min_jobs = 3        # Fewer finished jobs than this in the window: no verdict at all.
upload_stall_seconds = 60
upload_abandon_seconds = 300
retention_days_success = 14     # logs of succeeded jobs are removed after this
retention_days_failure = 30     # failed/cancelled/lost jobs keep their logs this long
# A failed job leaves a 50 KB log and a 720 MB workspace. The log is the evidence and keeps the
# days above; the bulk below goes much sooner. These three delete data - they are written out
# here on purpose so you can see and change them.
workspace_retention_days = 1    # kept workspaces (and the snapshot they came from) go after this
workspace_storage_max_bytes = 107374182400   # 100 GiB ceiling for that bulk, regardless of days. 0 = no limit
min_free_bytes = 10737418240    # reclaim bulk when the filesystem drops under 10 GiB free. 0 = off
metadata_retention_days = 180   # job rows/events are deleted after this (>= sample_days)
retention_sweep_interval_seconds = 3600
git_resolve_timeout_seconds = 20    # git ls-remote at submit time (git_ref presets)
git_fetch_timeout_seconds = 600     # fetch + checkout while materializing
snapshot_cache = true               # content-addressed uploads: only changed files travel
snapshot_cache_days = 30            # blobs unused this long are purged (never while a job references them)
snapshot_cache_max_bytes = 4294967296
snapshot_cache_scope = "global"     # "global" shares identical content between clients | "token"
worker_timeout_seconds = 60         # remote worker with no heartbeat this long: down, its jobs lost
worker_heartbeat_seconds = 5        # heartbeat period handed to `rcm worker`
worker_claim_wait_seconds = 20      # how long /worker/claim may long-poll for a job
artifact_retention_hours = 24       # a fetchable bundle lives this long, from when it is ready
max_artifact_bytes = 1073741824     # per job: the size of the collected files (1 GiB)
max_artifact_files = 10000          # per job: how many files
artifact_storage_max_bytes = 10737418240   # whole server (10 GiB). Full = new bundles dropped, none evicted
artifact_timeout_seconds = 60       # how long collecting the files may take
artifact_cancel_timeout_seconds = 5 # shorter budget after a cancel/timeout (< 2 x worker_heartbeat_seconds)
artifact_transfer_timeout_seconds = 300     # one upload or download
max_concurrent_artifact_transfers = 2       # over this, the server answers 503 instead of waiting
# advertise = true                  # mDNS/DNS-SD: sessions on the same network find this server without an address
#                                   # (default: on when bind is not loopback). advertise_name = "macmini" to rename

[estimate]
sample_days = 45
min_samples = 2
min_job_seconds = 30
sample_policy = "success"   # "success" | "completed"
default_seconds = 600
floor_remaining_seconds = 30
stuck_multiplier = 3
no_output_seconds = 240

[host]
interval_seconds = 5
gpu = "auto"
top_processes = 5
history_samples = 60

[display]
timezone = ""               # IANA zone, e.g. "Asia/Seoul". Empty = server local / browser local.

# ── Repositories for git_ref presets (deploy/release) ──────────────────────
# The server fetches the ref itself (mirror under <data_dir>/mirrors/<name>) using the build
# machine's git credentials (ssh key / credential helper). Any git hosting works.
# Uncomment and point at your repository:
# [[repos]]
# name = "app"
# url = "git@github.com:org/app.git"

# ── Presets ────────────────────────────────────────────────────────────────
# argv runs from the uploaded workspace root. No shell interpolation: inputs arrive as
# RCM_INPUT_<NAME> environment variables. Scripts may print step markers, e.g.
#   ::rcm::steps::3
#   ::rcm::step::analyze
#   ::rcm::step-end::ok
#   ::rcm::summary::all green
#   ::rcm::fail::flaky_test        # names what broke: a step, a test, a file
# Preset keys: name (required) · argv (required) · description · timeout_seconds · expected_seconds
#   (used until enough real samples exist) · duration_key_inputs (inputs whose value gets its own
#   median) · source_modes (default ["tree"]) · repo · concurrency_group · priority ("low" | "normal" | "high") ·
#   pool (worker pool, default "default") · pools (extra pools a session may pick with --pool) ·
#   env_passthrough (default: PATH HOME LANG) · [presets.env] · requires (tools the job must find in
#   its own environment before it starts — names or absolute paths; missing → failed, tool_missing).
# Input keys: name · type = "choice" | "string" | "int" | "bool" · choices (choice) · pattern (string)
#   · default · description.

# `ok` exists so a fresh install can prove the whole path (`rcm run ok`) before you write real
# presets. It runs no project code — delete it once your own presets work.
[[presets]]
name = "ok"
description = "Sanity check: prints one step marker and exits 0"
argv = ["sh", "-c", "echo ::rcm::step::hello; echo ok"]
timeout_seconds = 60
expected_seconds = 1

[[presets]]
name = "gate"
description = "Full local gate: analyze, test, lint"
argv = ["bash", "scripts/gate.sh"]
timeout_seconds = 1200
source_modes = ["tree"]
priority = "normal"         # "low" | "normal" | "high" — default for this preset and the ceiling for non-admin sessions
pool = "default"            # worker pool for this preset's jobs
# pools = ["linux"]         # extra pools a session may pick with --pool (remote workers, M5b)
expected_seconds = 480
duration_key_inputs = ["scope"]
# artifacts = ["test/**/goldens/*.png"]   # files this job produces that a session may fetch back
# artifacts_on = "failure"                # "always" (default) | "failure" — when to collect
# requires = ["fvm", "gitleaks"]          # looked up in the job's PATH right before it starts;
#                                         # missing → the job fails with tool_missing, nothing runs
env_passthrough = ["PATH", "HOME", "LANG"]
[presets.env]
CI = "1"
# PATH = "/opt/homebrew/bin:/usr/bin:/bin"   # a launchd service has a short PATH — give the job its own
[[presets.inputs]]
name = "scope"
type = "choice"
choices = ["full", "commit", "fast"]
default = "full"

[[presets]]
name = "gate-fast"
description = "Quick checks only"
argv = ["bash", "scripts/gate.sh", "--fast"]
timeout_seconds = 300
expected_seconds = 60

[[presets]]
name = "qa-smoke"
description = "Smoke test on the shared device/simulator (serialized via concurrency_group)"
argv = ["bash", "scripts/qa-smoke.sh"]
timeout_seconds = 900
concurrency_group = "devices"
expected_seconds = 540
[[presets.inputs]]
name = "device"
type = "string"
pattern = "[A-Za-z0-9._-]+"
default = "default"

# ── Notifications ──────────────────────────────────────────────────────────
# Run a command (no shell) or POST JSON to a URL when jobs finish. Env for argv: RCM_JOB_ID RCM_STATE
# RCM_PRESET RCM_KEY RCM_REQUESTER RCM_SUMMARY RCM_FAILED_STEP RCM_EXIT_CODE RCM_JOB_SECONDS RCM_URL
# RCM_NOTIFY. Exactly one of argv / url. `on` defaults to every terminal state.
# [[notify]]
# name = "on-failure"
# on = ["failed", "timed_out", "lost"]
# presets = ["gate"]
# argv = ["bash", "/opt/rcm/notify.sh"]
# timeout_seconds = 30

# A deploy preset runs a remote ref instead of an uploaded tree: `rcm run deploy --ref v1.2.3`.
# The server pins the commit sha at submit time; the workspace is a detached checkout (.git kept,
# submodules are NOT initialised — do it in the script if needed). Requires a [[repos]] entry.
# [[presets]]
# name = "deploy"
# description = "Deploy a tagged release"
# argv = ["bash", "scripts/deploy.sh"]
# source_modes = ["git_ref"]
# repo = "app"
# timeout_seconds = 1800
# concurrency_group = "deploy"
